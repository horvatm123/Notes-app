<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f5f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilješke">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bilješke</title>
<script>
  // apply saved settings before the first paint, so the page does not flash in the wrong theme
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem('settings') || '{}') || {}; } catch (e) { /* ignore */ }
    var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    var r = document.documentElement;
    r.dataset.theme = dark ? 'dark' : 'light';
    r.dataset.font = s.font === 'sans' ? 'system' : (s.font || 'dm');
    r.dataset.size = s.size || 'l';
    r.dataset.accent = s.accent || 'blue';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#0e0e11' : '#f4f5f9';
  })();
</script>
<link rel="preload" href="fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Home: list of notes -->
<main id="home" class="view-home">
  <header class="appbar">
    <div id="appbarMain" class="appbar-row">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Izbornik" data-icon="menu"></button>
      <h1 id="homeTitle">Bilješke</h1>
      <button id="searchBtn" class="icon-btn" type="button" aria-label="Pretraži" data-icon="search"></button>
      <button id="viewBtn" class="icon-btn" type="button" aria-label="Promijeni prikaz"></button>
      <button id="folderMenuBtn" class="icon-btn" type="button" aria-label="Opcije mape" data-icon="dots" hidden></button>
    </div>
    <div id="appbarSearch" class="appbar-row" hidden>
      <button id="searchClose" class="icon-btn" type="button" aria-label="Zatvori pretragu" data-icon="back"></button>
      <input id="search" type="search" placeholder="Pretraži bilješke…" aria-label="Pretraži bilješke" autocomplete="off">
    </div>
    <div id="tabsRow" class="tabs-row">
      <nav id="tabs" class="tabs" aria-label="Mape"></nav>
      <button id="allFoldersBtn" class="icon-btn folders-btn" type="button" aria-label="Sve mape" data-icon="folders"></button>
    </div>
  </header>
  <section id="list" class="list mode-list"></section>
  <button id="newBtn" class="fab" type="button" aria-label="Nova bilješka" data-icon="plus"></button>
</main>

<!-- Note editor -->
<section id="editor" class="view" hidden>
  <div class="bar">
    <button id="doneBtn" class="bubble-btn back-btn" type="button" aria-label="Natrag"><span data-icon="back"></span></button>
    <span class="bar-right">
      <span id="lockBadge" class="lock-badge" hidden><span data-icon="lock"></span>Zaključano</span>
      <span id="saveState" class="muted" aria-live="polite"></span>
      <button id="saveBtn" class="bubble-btn" type="button"><span data-icon="check"></span>Spremi</button>
    </span>
  </div>
  <input id="title" class="title-input" placeholder="Naslov" autocomplete="off" aria-label="Naslov">
  <div id="body" class="rich" contenteditable="true" role="textbox" aria-multiline="true"
       data-placeholder="Piši ovdje…"></div>

  <button id="penBtn" class="pen-fab" type="button" aria-label="Alati za oblikovanje" data-icon="pen"></button>
  <div id="tools" class="tools" hidden>
    <div id="toolPanel" class="tool-panel" hidden></div>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Oblikovanje">
      <button type="button" data-cmd="bold" aria-label="Podebljano"><b>B</b></button>
      <button type="button" data-cmd="italic" aria-label="Kurziv"><i class="i-glyph">I</i></button>
      <button type="button" data-cmd="underline" aria-label="Podcrtavanje u boji"><span class="u-glyph">U</span><span class="ind"></span></button>
      <button type="button" data-cmd="color" aria-label="Boja slova"><span class="a-glyph">A</span><span class="ind"></span></button>
      <button type="button" data-cmd="highlight" aria-label="Isticanje"><span data-icon="highlight"></span><span class="ind"></span></button>
      <button type="button" data-cmd="size" aria-label="Veličina slova"><span class="size-glyph">A<small>A</small></span></button>
      <button type="button" data-cmd="list" aria-label="Popis"><span data-icon="list"></span></button>
      <button type="button" data-cmd="todo" aria-label="Popis zadataka"><span data-icon="checklist"></span></button>
      <button type="button" data-cmd="image" aria-label="Dodaj sliku"><span data-icon="photo"></span></button>
      <button type="button" data-cmd="close" class="close-btn" aria-label="Zatvori alate"><span data-icon="close"></span></button>
    </div>
  </div>
  <input id="imgInput" type="file" accept="image/*" hidden>
</section>

<!-- Overlays -->
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Izbornik">
  <h2>Bilješke</h2>
  <nav id="drawerList"></nav>
</aside>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
<div id="pin" class="pin" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div id="pinCard" class="pin-card">
    <h3 id="pinTitle"></h3>
    <p id="pinText"></p>
    <div id="pinDots" class="pin-dots" aria-hidden="true"></div>
    <p id="pinError" class="pin-error" aria-live="assertive"></p>
    <div id="pinPad" class="pin-pad"></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<input id="importInput" type="file" multiple
       accept=".json,.zip,.txt,.md,application/json,application/zip,application/x-zip-compressed,text/plain,text/markdown" hidden>

<script src="app.js"></script>
</body>
</html>
