<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilješke">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Bilješke</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Home: list of notes -->
<main id="home" class="view">
  <header class="top">
    <h1>Bilješke</h1>
  </header>
  <div class="search">
    <input id="search" type="search" placeholder="Pretraži bilješke…" aria-label="Pretraži bilješke" autocomplete="off">
  </div>
  <nav id="chips" aria-label="Mape"></nav>
  <section id="list"></section>
  <button id="newBtn" class="fab" type="button" aria-label="Nova bilješka">+</button>
</main>

<!-- Note editor -->
<section id="editor" class="view" hidden>
  <div class="bar">
    <button id="doneBtn" class="ghost" type="button">← Natrag</button>
    <span id="saveState" class="muted" aria-live="polite"></span>
    <button id="delBtn" class="danger" type="button">Obriši</button>
  </div>
  <input id="title" class="title-input" placeholder="Naslov" autocomplete="off" aria-label="Naslov">
  <select id="folderSel" aria-label="Mapa"></select>
  <div id="body" contenteditable="true" role="textbox" aria-multiline="true"
       data-placeholder="Piši ovdje…"></div>

  <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatiranje">
    <button type="button" data-cmd="bold" aria-label="Podebljano"><b>B</b></button>
    <button type="button" data-cmd="italic" aria-label="Kurziv"><i>I</i></button>
    <button type="button" data-cmd="heading" aria-label="Naslov">H</button>
    <button type="button" data-cmd="ul" aria-label="Popis s točkama">•</button>
    <button type="button" data-cmd="ol" aria-label="Numerirani popis">1.</button>
    <button type="button" data-cmd="todo" aria-label="Popis zadataka">☑</button>
    <button type="button" data-cmd="image" aria-label="Dodaj sliku">Slika</button>
  </div>
  <input id="imgInput" type="file" accept="image/*" hidden>
</section>

<!-- Folder editor -->
<section id="folderEd" class="view" hidden>
  <div class="bar">
    <button id="fCancel" class="ghost" type="button">← Natrag</button>
    <button id="fDel" class="danger" type="button">Obriši mapu</button>
  </div>
  <h2 id="fTitle">Mapa</h2>
  <input id="fName" placeholder="Ime mape" autocomplete="off">
  <div id="swatches"></div>
  <button id="fSave" class="primary" type="button">Spremi</button>
</section>

<script src="app.js"></script>
</body>
</html>
