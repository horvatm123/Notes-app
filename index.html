<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilješke</title>
<style>
  :root { --bg:#fafafa; --fg:#1c1c1e; --muted:#8e8e93; --card:#fff; --accent:#3b82f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#888; --card:#1e1e1e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:16px; position:sticky; top:0; background:var(--bg); z-index:1; }
  h1 { margin:0; font-size:1.4rem; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 16px;
           background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--accent); }
  button.danger { background:transparent; color:#e11d48; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; }
  .chip { flex:none; background:var(--card); color:var(--fg); padding:8px 14px;
          border-radius:20px; display:flex; align-items:center; gap:6px; }
  .chip.active { outline:2px solid var(--accent); }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #list { padding:0 16px 16px; display:grid; gap:10px; }
  .note { background:var(--card); border-radius:12px; padding:14px; border-left:6px solid transparent; }
  .note b { display:block; }
  .note small { color:var(--muted); display:block; }
  #editor, #folderEd { display:none; padding:16px; }
  input, textarea, select { width:100%; font:inherit; color:var(--fg);
    background:var(--card); border:0; border-radius:10px; padding:12px; margin-bottom:10px; }
  #body { min-height:45vh; resize:vertical; }
  .bar { display:flex; justify-content:space-between; }
  #swatches { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 20px; }
  .sw { width:44px; height:44px; border-radius:50%; padding:0; }
  .sw.sel { outline:3px solid var(--fg); outline-offset:2px; }
</style>
</head>
<body>

<div id="home">
  <header>
    <h1>Bilješke</h1>
    <button id="newBtn">+ Nova</button>
  </header>
  <div id="chips"></div>
  <div id="list"></div>
</div>

<div id="editor">
  <div class="bar">
    <button class="ghost" id="doneBtn">← Gotovo</button>
    <button class="danger" id="delBtn">Obriši</button>
  </div>
  <input id="title" placeholder="Naslov">
  <select id="folderSel"></select>
  <textarea id="body" placeholder="Piši ovdje..."></textarea>
</div>

<div id="folderEd">
  <div class="bar">
    <button class="ghost" id="fCancel">← Natrag</button>
    <button class="danger" id="fDel">Obriši mapu</button>
  </div>
  <h2 id="fTitle">Mapa</h2>
  <input id="fName" placeholder="Ime mape">
  <div id="swatches"></div>
  <button id="fSave">Spremi</button>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
let db, current = null, curFolder = null, filter = 'all';
let folders = [];

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('biljeske', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const st = (s, m) => db.transaction(s, m).objectStore(s);
const getAll = s => new Promise(res => { const r = st(s, 'readonly').getAll(); r.onsuccess = () => res(r.result); });
const put = (s, o) => new Promise(res => { const r = st(s, 'readwrite').put(o); r.onsuccess = res; });
const del = (s, id) => new Promise(res => { const r = st(s, 'readwrite').delete(id); r.onsuccess = res; });

const show = id => {
  for (const v of ['home', 'editor', 'folderEd']) $(v).style.display = v === id ? 'block' : 'none';
};
const folderById = id => folders.find(f => f.id === id);

async function render() {
  folders = (await getAll('folders')).sort((a, b) => a.name.localeCompare(b.name));
  if (filter !== 'all' && !folderById(filter)) filter = 'all';

  // chips
  const chips = $('chips');
  chips.innerHTML = '';
  const mkChip = (label, color, active, onclick) => {
    const c = document.createElement('button');
    c.className = 'chip' + (active ? ' active' : '');
    if (color) {
      const d = document.createElement('span');
      d.className = 'dot'; d.style.background = color;
      c.append(d);
    }
    c.append(label);
    c.onclick = onclick;
    chips.append(c);
  };
  mkChip('Sve', null, filter === 'all', () => { filter = 'all'; render(); });
  for (const f of folders)
    mkChip(f.name, f.color, filter === f.id, () => {
      if (filter === f.id) openFolderEd(f); else { filter = f.id; render(); }
    });
  mkChip('+ Mapa', null, false, () => openFolderEd());

  // notes
  let notes = (await getAll('notes')).sort((a, b) => b.updated - a.updated);
  if (filter !== 'all') notes = notes.filter(n => n.folderId === filter);
  const list = $('list');
  list.innerHTML = '';
  if (!notes.length) list.innerHTML = '<p style="color:var(--muted)">Nema bilješki.</p>';
  for (const n of notes) {
    const f = folderById(n.folderId);
    const el = document.createElement('div');
    el.className = 'note';
    if (f) el.style.borderLeftColor = f.color;
    const t = document.createElement('b');
    t.textContent = n.title || 'Bez naslova';
    const s = document.createElement('small');
    s.textContent = (n.body || '').slice(0, 60);
    el.append(t, s);
    el.onclick = () => openEditor(n);
    list.append(el);
  }
}

function openEditor(n) {
  current = n || { id: crypto.randomUUID(), title: '', body: '', folderId: filter === 'all' ? null : filter, updated: Date.now() };
  $('title').value = current.title;
  $('body').value = current.body;
  const sel = $('folderSel');
  sel.innerHTML = '<option value="">Bez mape</option>';
  for (const f of folders) {
    const o = document.createElement('option');
    o.value = f.id; o.textContent = f.name;
    sel.append(o);
  }
  sel.value = current.folderId || '';
  show('editor');
}

async function closeEditor() {
  current.title = $('title').value.trim();
  current.body = $('body').value;
  current.folderId = $('folderSel').value || null;
  current.updated = Date.now();
  if (current.title || current.body) await put('notes', current);
  else await del('notes', current.id);
  show('home');
  await render();
}

function openFolderEd(f) {
  curFolder = f ? { ...f } : { id: crypto.randomUUID(), name: '', color: COLORS[5] };
  $('fTitle').textContent = f ? 'Uredi mapu' : 'Nova mapa';
  $('fName').value = curFolder.name;
  $('fDel').style.display = f ? 'block' : 'none';
  drawSwatches();
  show('folderEd');
}

function drawSwatches() {
  const box = $('swatches');
  box.innerHTML = '';
  for (const c of COLORS) {
    const b = document.createElement('button');
    b.className = 'sw' + (c === curFolder.color ? ' sel' : '');
    b.style.background = c;
    b.onclick = () => { curFolder.color = c; drawSwatches(); };
    box.append(b);
  }
}

$('newBtn').onclick = () => openEditor();
$('doneBtn').onclick = closeEditor;
$('delBtn').onclick = async () => {
  if (!confirm('Obrisati bilješku?')) return;
  await del('notes', current.id);
  show('home');
  await render();
};

$('fCancel').onclick = () => show('home');
$('fSave').onclick = async () => {
  curFolder.name = $('fName').value.trim();
  if (!curFolder.name) { alert('Upiši ime mape.'); return; }
  await put('folders', curFolder);
  filter = curFolder.id;
  show('home');
  await render();
};
$('fDel').onclick = async () => {
  if (!confirm('Obrisati mapu? Bilješke u njoj ostaju, bez mape.')) return;
  const notes = await getAll('notes');
  for (const n of notes) if (n.folderId === curFolder.id) { n.folderId = null; await put('notes', n); }
  await del('folders', curFolder.id);
  filter = 'all';
